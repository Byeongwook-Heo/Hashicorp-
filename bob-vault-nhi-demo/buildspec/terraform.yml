version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - ./scripts/install-terraform.sh
  pre_build:
    commands:
      - set -euo pipefail
      - cd infra/terraform
      - terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config="key=${TF_STATE_KEY}" -backend-config="region=${AWS_REGION}" -backend-config="use_lockfile=true"
      - terraform validate
  build:
    commands:
      - |
        set -euo pipefail
        case "${TF_ACTION:-plan}" in
          plan)
            terraform plan -input=false -lock-timeout=5m -var="deploy_service=false"
            ;;
          apply-base)
            terraform apply -auto-approve -input=false -lock-timeout=5m -var="deploy_service=false"
            ;;
          deploy-bootstrap)
            terraform apply -auto-approve -input=false -lock-timeout=5m -var="deploy_service=true" -var="app_mode=bootstrap"
            ;;
          deploy-app)
            terraform apply -auto-approve -input=false -lock-timeout=5m -var="deploy_service=true" -var="app_mode=aws"
            ;;
          chatbot-plan)
            terraform plan -input=false -lock-timeout=5m -var="deploy_service=true" -var="app_mode=aws" -var="chatbot_enabled=true" -var="inference_enabled=true"
            ;;
          deploy-chatbot)
            terraform apply -auto-approve -input=false -lock-timeout=5m -var="deploy_service=true" -var="app_mode=aws" -var="chatbot_enabled=true" -var="inference_enabled=true"
            ;;
          event-access-plan)
            terraform plan \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_iam_role_policy.event_operator \
              -target=aws_iam_role_policy.vault_ssm_session_logging
            ;;
          event-access-apply)
            terraform apply \
              -auto-approve \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_iam_role_policy.event_operator \
              -target=aws_iam_role_policy.vault_ssm_session_logging
            ;;
          event-ssh-plan)
            terraform plan \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_eip.bastion \
              -target=aws_vpc_security_group_ingress_rule.bastion_ssh \
              -target=aws_vpc_security_group_egress_rule.bastion_to_vault \
              -target=aws_vpc_security_group_egress_rule.bastion_https \
              -target=aws_vpc_security_group_egress_rule.bastion_dns_udp \
              -target=aws_vpc_security_group_egress_rule.bastion_dns_tcp \
              -target=aws_vpc_security_group_egress_rule.bastion_ntp \
              -target=aws_route53_record.bastion \
              -target=aws_ssm_association.bastion_event_ssh \
              -target=aws_ssm_association.vault_event_ssh \
              -target=aws_vpc_security_group_ingress_rule.vault_ssh_from_bastion
            ;;
          event-ssh-apply)
            terraform apply \
              -auto-approve \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_eip.bastion \
              -target=aws_vpc_security_group_ingress_rule.bastion_ssh \
              -target=aws_vpc_security_group_egress_rule.bastion_to_vault \
              -target=aws_vpc_security_group_egress_rule.bastion_https \
              -target=aws_vpc_security_group_egress_rule.bastion_dns_udp \
              -target=aws_vpc_security_group_egress_rule.bastion_dns_tcp \
              -target=aws_vpc_security_group_egress_rule.bastion_ntp \
              -target=aws_route53_record.bastion \
              -target=aws_ssm_association.bastion_event_ssh \
              -target=aws_ssm_association.vault_event_ssh \
              -target=aws_vpc_security_group_ingress_rule.vault_ssh_from_bastion
            ;;
          verify-jwks-plan)
            terraform plan \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_vpc_security_group_ingress_rule.alb_verify_jwks_https \
              -target=aws_lb_listener_rule.verify_jwks \
              -target=aws_lb_listener_rule.deny_verify_other_paths
            ;;
          verify-jwks-apply)
            terraform apply \
              -auto-approve \
              -input=false \
              -lock-timeout=5m \
              -var="deploy_service=true" \
              -var="app_mode=bootstrap" \
              -target=aws_vpc_security_group_ingress_rule.alb_verify_jwks_https \
              -target=aws_lb_listener_rule.verify_jwks \
              -target=aws_lb_listener_rule.deny_verify_other_paths
            ;;
          destroy)
            test "${CONFIRM_DESTROY:-}" = "${PROJECT_NAME}"
            terraform destroy -auto-approve -input=false -lock-timeout=5m -var="deploy_service=false"
            ;;
          *)
            echo "Unsupported TF_ACTION: ${TF_ACTION}" >&2
            exit 2
            ;;
        esac
